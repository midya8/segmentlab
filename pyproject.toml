[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentlab"
version = "0.1.0"
description = "Exact offline Gaussian changepoint partition audits"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
segmentlab = "segmentlab.cli:main"

[tool.setuptools.packages.find]
include = ["segmentlab*"]
